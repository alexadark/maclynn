<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --bg: #f7f4ec;
                --surface: #fffdf7;
                --border: #ddd5c4;
                --text: #221f1a;
                --muted: #867d6c;
                --accent: #8a2b1f;
                --danger: #9c2b22;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                min-height: 100%;
                margin: 0;
                background: var(--bg);
                font-family: Georgia, 'Times New Roman', serif;
                color: var(--text);
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-content { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
            .staticrypt-form {
                background: var(--surface);
                border: 1px solid var(--border);
                border-top: 3px double var(--text);
                border-bottom: 3px double var(--border);
                max-width: 440px;
                width: 100%;
                padding: 42px 44px 36px;
            }
            .staticrypt-eyebrow {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 1rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 14px;
            }
            .staticrypt-title {
                font-family: Georgia, 'Times New Roman', serif;
                font-weight: 900;
                font-size: 2.1rem;
                line-height: 1.05;
                letter-spacing: -0.02em;
                margin-bottom: 12px;
            }
            .staticrypt-title .dot { color: var(--accent); }
            .staticrypt-instructions p.staticrypt-lede {
                font-family: Georgia, 'Times New Roman', serif;
                font-style: italic;
                font-size: 1.08rem;
                color: var(--muted);
                margin-bottom: 26px;
            }
            .staticrypt-hr { border: 0; border-top: 1px solid var(--border); margin: 0 0 26px; }
            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin: 0 0 16px;
                background: var(--bg);
                border: 1px solid var(--border);
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 16px;
                color: var(--text);
                padding: 14px 46px 14px 14px;
                width: 100%;
            }
            .staticrypt-form input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 55%;
                padding: 14px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                box-sizing: content-box;
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 22px;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 1rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
                cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
            .staticrypt-form .staticrypt-decrypt-button {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                text-transform: uppercase;
                letter-spacing: 0.16em;
                font-size: 1rem;
                font-weight: 600;
                outline: 0;
                background: var(--accent);
                width: 100%;
                border: 0;
                padding: 15px;
                color: #fffdf7;
                cursor: pointer;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus { filter: brightness(112%); }
            .staticrypt-error {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 1rem;
                letter-spacing: 0.06em;
                color: var(--danger);
                border-left: 3px solid var(--danger);
                padding: 8px 12px;
                margin-top: 16px;
            }
            .staticrypt-colophon {
                margin-top: 28px;
                padding-top: 16px;
                border-top: 1px solid var(--border);
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 1rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem; height: 2rem;
                border: 0.25em solid var(--border);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
    </head>
